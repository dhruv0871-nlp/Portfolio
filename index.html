:"Web Developer Intern",organization:"CodSoft",period:"July 2025 – August 2025",location:"Virtual / Remote",type:"Internship",responsibilities:["Built a responsive multi-section landing page using semantic HTML5 and clean CSS3, ensuring structured layout and consistent rendering across mobile and desktop displays.","Developed an interactive web-based arithmetic calculator using Vanilla JavaScript and CSS Grid, implementing clear event listeners, input validation, and operator precedence logic.","Maintained code versioning on GitHub with structured commit practices and cross-browser testing."],technologies:["HTML5","CSS3","JavaScript","CSS Grid","Git","GitHub"]}],certifications:[{name:"SQL (Advanced)",issuer:"HackerRank",status:"Verified Certificate",credentialUrl:"https://www.hackerrank.com",skillsCovered:["Complex Joins","Window Functions (ROW_NUMBER, RANK, DENSE_RANK)","Subqueries & CTEs","Aggregations & Grouping","Query Optimization"]},{name:"Software Engineer",issuer:"HackerRank",status:"Verified Certificate",credentialUrl:"https://www.hackerrank.com",skillsCovered:["Data Structures","Algorithms","Logic & Problem Solving","Software Engineering Fundamentals"]},{name:"Python (Basic)",issuer:"HackerRank",status:"Verified Certificate",credentialUrl:"https://www.hackerrank.com",skillsCovered:["Control Flow","Data Types & Collections","Functions & Scoping","File Operations"]},{name:"Introduction to Cloud Semester 2",issuer:"AWS Academy",status:"Course Certificate",credentialUrl:"https://aws.amazon.com/training/awsacademy/",skillsCovered:["Cloud Computing Architecture","Amazon EC2 & S3 Basics","Cloud Security Principles","Cost Management"]}]},zt=[{id:"retail-etl-dashboard",title:"Automated Retail Sales Pipeline & BI Dashboard",subtitle:"End-to-end data extraction, transformation, star-schema relational modeling, and dynamic executive dashboard in Microsoft Excel.",category:"Business Intelligence",summary:"A complete retail operations pipeline that automatically imports daily raw transactions across regional stores, cleans inconsistent formats with Power Query M-code, models relationships with Power Pivot, and outputs an interactive executive dashboard with synchronized KPI slicers.",businessContext:"In retail management, raw sales spreadsheets typically arrive from multiple store locations with mismatched date conventions, duplicate records, missing product categories, and unstandardized currency figures. Prior to automation, store managers spent several hours each week copying data into master workbooks, leading to human entry errors and outdated reporting for leadership.",technicalArchitecture:["Multi-source folder-based data ingestion in Power Query","Data transformation pipeline using M formula language","Star-schema relational model built within Power Pivot","DAX calculated measures for rolling revenue, margin % and order counts","Dynamic PivotCharts and synchronized slicers for cross-filtering"],dataModelDetails:{schemaType:"Star Schema (1 Fact Table : 4 Dimension Tables)",factTables:["Fact_Sales (TransactionID, DateKey, ProductKey, StoreKey, Quantity, UnitPrice, Discount, TotalAmount)"],dimensionTables:["Dim_Product (ProductKey, ProductName, Category, SubCategory, UnitCost)","Dim_Store (StoreKey, StoreName, Region, City, StoreManager)","Dim_Calendar (DateKey, Date, Month, Quarter, Year, DayOfWeek)","Dim_Customer (CustomerKey, CustomerSegment, Region)"],keyMeasures:["Total Revenue = SUM(Fact_Sales[TotalAmount])","Total Profit = SUMX(Fact_Sales, Fact_Sales[TotalAmount] - (Fact_Sales[Quantity] * RELATED(Dim_Product[UnitCost])))","Gross Margin % = DIVIDE([Total Profit], [Total Revenue], 0)","YoY Revenue Growth = DIVIDE([Total Revenue] - [Prior Year Revenue], [Prior Year Revenue], 0)"]},implementationSteps:[{step:"1. Ingestion & Automated File Appending",details:"Configured Power Query to monitor a designated directory. As new regional transaction CSVs or workbooks are deposited, the pipeline automatically detects, unpacks, and appends the records without requiring manual copy-pasting."},{step:"2. Data Cleansing & Normalization",details:"Applied M-code transformations to trim whitespace, standardize date formats into ISO standard (YYYY-MM-DD), remove duplicate transaction records, handle null values in discount fields, and enforce strong column data typing."},{step:"3. Relational Modeling in Power Pivot",details:"Loaded cleaned tables into the Power Pivot data model. Established 1-to-many relationships from the dimension tables (Product, Store, Calendar) to the Fact_Sales table, enforcing referential integrity and removing data redundancy."},{step:"4. Formulating Business DAX Measures",details:"Authored explicit DAX calculations for revenue, COGS, net margins, transaction volume, and time-intelligence comparisons to keep calculation logic centralized rather than scattered across spreadsheet cells."},{step:"5. Dashboard Construction & UX",details:"Designed an uncluttered executive view featuring top-level KPI cards, revenue trend by quarter, regional margin breakdown, top-performing product categories, and synchronized interactive slicers for quick managerial drill-down."}],challengesAndSolutions:[{challenge:"Inconsistent regional store date formats (e.g. DD/MM/YYYY vs MM/DD/YYYY) causing calculation errors.",solution:"Built an explicit parsing step in Power Query using Date.FromText with Culture parameters to reliably parse regional date strings before loading."},{challenge:"Large record volumes slowing down standard spreadsheet recalculation.",solution:"Moved the entire calculation layer into the Power Pivot VertiPaq in-memory engine, keeping the Excel workbook responsive and avoiding volatile cell formulas."}],tangibleResults:["Eliminated manual weekly data entry and reconciliation time for store managers.","Provided instantaneous single-click filtering across store locations, product lines, and fiscal quarters.","Ensured 100% consistent KPI definitions across reports via standardized DAX measures."],toolsUsed:["Microsoft Excel","Power Query (M Language)","Power Pivot","DAX Measures","Relational Data Modeling","PivotCharts & Slicers"],githubUrl:"https://github.com/dhruv0871-nlp/Automated-Retail-Operations-ETL-BI-Dashboard"},{id:"agentic-text-to-sql",title:"Business Intelligence Engine (Agentic Text-to-SQL)",subtitle:"An AI-assisted querying system that translates natural language business questions into structured, verified SQL for relational databases.",category:"Data Engineering & AI",summary:"A Python backend application engineered to assist non-technical business colleagues who need fast data answers without waiting for a database specialist. The system parses business questions, links them to database schema tables and columns, generates safe SQL queries, verifies syntax, and returns formatted result tables with safety controls.",businessContext:'In many business environments, business managers and operations staff frequently need ad-hoc data points (e.g., "Which products had declining margins in the North region last month?"). Because they do not write SQL, they submit tickets to busy data analysts. This engine aims to solve standard ad-hoc questions safely and instantly while enforcing strict database read-only constraints.',technicalArchitecture:["Schema context extraction and table-column metadata indexing","LangGraph multi-step state graph orchestrating intent and SQL generation","Syntax and AST safety verification ensuring read-only query execution","Self-correction feedback loop catching syntax or missing column errors","FastAPI REST endpoints and containerized deployment via Docker"],implementationSteps:[{step:"1. Schema Context Retrieval",details:"Extracted database schema metadata (table names, column types, foreign key relationships, and sample representative values) to feed into the prompt context so the model understands table relationships."},{step:"2. Multi-Step LangGraph Agent Graph",details:"Structured the generation process as a state graph: Step A identifies relevant tables; Step B constructs the SQL query; Step C evaluates syntax and safety guardrails; Step D executes or branches to self-correction."},{step:"3. Security & Safety Guardrails",details:"Enforced strict read-only execution at two layers: software validation (parsing the AST to reject any statements containing DROP, DELETE, UPDATE, ALTER, or INSERT) and database credential isolation (connecting with a dedicated MySQL user possessing only SELECT privileges)."},{step:"4. Self-Correcting Execution Feedback",details:"If MySQL returns a execution error (such as an incorrect column name or group-by requirement), the error output is piped back into the agent state, which analyzes the error and regenerates a corrected query (up to 3 automated retry attempts)."},{step:"5. API Packaging",details:"Wrapped the core agent into a lightweight FastAPI service with request/response schemas validated via Pydantic, making it easy to connect with front-end dashboards or internal chat tools."}],challengesAndSolutions:[{challenge:'Ambiguity in business phrasing (e.g., user asks for "top customers" without specifying whether they mean by revenue, order count, or profit).',solution:'Implemented clarification rules and default analytical assumptions clearly stated in the response output (e.g., "Ranked by total sales revenue").'},{challenge:"Protecting production databases from destructive queries or heavy unbounded scans.",solution:"Configured query timeouts, automated injection of LIMIT clauses on exploratory queries, and database user permission restriction strictly to SELECT."}],tangibleResults:["Allows team members to query MySQL databases using plain English questions.","Achieved reliable query execution on relational schemas with automatic syntax self-correction.","Completely prevents unauthorized data manipulation via defense-in-depth safety checks."],toolsUsed:["Python","SQL (MySQL)","LangGraph","FastAPI","Hugging Face Models","Docker","Pydantic"],githubUrl:"https://github.com/dhruv0871-nlp"},{id:"game-analytics-tracker",title:"Game Analytics & Statistical Strategy Model (8 Ball Pool)",subtitle:"Quantitative risk assessment, outcome probability modeling, and spatial decision analysis using Python.",category:"Quantitative Analytics",summary:"A data analysis and probability modeling project that evaluates shot difficulty, bank angle tolerances, and positional risk trade-offs in 8 Ball Pool. By logging spatial and statistical parameters, the project calculates optimal risk-reward decisions rather than relying on intuitive guesswork.",businessContext:"Analytical decision modeling is fundamental to understanding probability under uncertainty. Whether evaluating portfolio risk, operational failure margins, or competitive strategy, decision makers often overestimate low-probability outcomes and underestimate cumulative errors. This project explores practical statistical modeling through competitive game metrics.",technicalArchitecture:["Telemetry data logging and structured tabular storage in Pandas","Geometric tolerance and margin-of-error calculation functions in NumPy","Empirical probability distribution analysis and hypothesis testing","Visual decision plots and distribution heatmaps using Matplotlib & Seaborn"],implementationSteps:[{step:"1. Metric Definition & Data Collection",details:"Identified key decision variables: shot distance, cut angle (degrees), distance to target pocket, cue ball speed, and cue ball final position margin. Logged match data into structured DataFrames."},{step:"2. Exploratory Data Analysis (EDA)",details:"Examined correlation between cut angles and potting failure rates. Visualized success distributions across varied distances to determine the empirical threshold where direct pots become statistically disadvantageous."},{step:"3. Risk vs. Reward Decision Matrix",details:"Constructed an expected value formula balancing high-probability safety play against low-probability aggressive pot attempts based on positional follow-up."},{step:"4. Visual Communication",details:"Rendered scatter charts and distribution plots with Matplotlib and Seaborn to clearly communicate probability thresholds and optimal decision boundaries."}],challengesAndSolutions:[{challenge:"Small initial sample sizes leading to noisy outlier estimations on extreme angle shots.",solution:"Applied smoothing and grouped continuous angles into discrete bins (e.g. 0-15°, 16-30°, 31-45°) to extract statistically meaningful trends."}],tangibleResults:["Established empirical baseline success percentages for various cut angles and table positions.","Built reusable Python scripts for statistical analysis, data cleaning, and automated charting.","Demonstrated quantitative problem-solving and risk-reward modeling principles."],toolsUsed:["Python","Pandas","NumPy","Matplotlib","Seaborn","Statistical Modeling","Exploratory Data Analysis (EDA)"],githubUrl:"https://github.com/dhruv0871-nlp/8-Ball-Pool-Analytics-Strategy-Model"},{id:"web-development-showcase",title:"Responsive Web Applications & Calculator Engine",subtitle:"Front-end applications focusing on semantic HTML5 structure, CSS Grid responsiveness, and event-driven JavaScript.",category:"Web Development",summary:"Practical web development projects built during the CodSoft internship, featuring an interactive arithmetic calculator and a structured multi-section landing page adhering to clean coding standards.",businessContext:"Clear data presentation requires a strong understanding of web front-end principles. Building accessible, responsive user interfaces ensures that analytical tools and reporting portals work reliably on any device or screen size.",technicalArchitecture:["Semantic HTML5 structure optimized for readability and accessibility","CSS Grid and Flexbox responsive styling without bulky dependencies","Event-driven JavaScript logic for user input capture and arithmetic handling","Version controlled with Git and GitHub"],implementationSteps:[{step:"1. Semantic Structure & Layout",details:"Structured pages using clean semantic HTML elements (header, nav, main, section, footer) ensuring accessibility compliance."},{step:"2. Responsive Grid Implementation",details:"Utilized CSS Grid for the calculator keypad layout and responsive flex containers for landing page sections, testing across diverse viewport widths."},{step:"3. State & Arithmetic Event Handling",details:"Implemented JavaScript logic for processing sequential arithmetic operations, handling edge cases such as division by zero, floating point decimals, and keyboard navigation."}],challengesAndSolutions:[{challenge:"Handling decimal precision quirks in JavaScript floating-point arithmetic.",solution:"Implemented rounding and string normalization helpers to prevent precision display errors on repeated calculations."}],tangibleResults:["Zero-dependency Vanilla JavaScript application with immediate response times.","Fully responsive UI functioning seamlessly on mobile, tablet, and desktop screens.","Completed internship milestone requirements with clean, documented code."],toolsUsed:["HTML5","CSS3","JavaScript (ES6+)","CSS Grid & Flexbox","Git","GitHub"],githubUrl:"https://github.com/dhruv0871-nlp"}],Cp=[{category:"Business Intelligence & Data Modeling",description:"Tools and methodologies for building structured, reliable reporting pipelines and executive dashboards.",skills:[{name:"Microsoft Excel",levelDescription:"Advanced Proficiency",practicalUsage:"Nested logical formulas (XLOOKUP, INDEX/MATCH, SUMIFS), financial modeling, data validation, dynamic arrays, scenario managers.",highlight:!0},{name:"Power Query & M Language",levelDescription:"Advanced Proficiency",practicalUsage:"Automated ETL ingestion from multi-format files, data cleaning, unpivoting columns, date parsing, column derivations, schedule refresh.",highlight:!0},{name:"Power Pivot & DAX",levelDescription:"Proficient",practicalUsage:"Star-schema modeling, esta
